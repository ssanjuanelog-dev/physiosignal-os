[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-in-emg"
version = "0.1.0"
description = "Task-preserving benchmark and toolkit for ECG removal from surface EMG"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mne>=1.6.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "matplotlib>=3.7.0"
]

[tool.setuptools.packages.find]
where = ["src"]
