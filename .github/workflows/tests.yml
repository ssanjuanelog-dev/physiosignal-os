name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsndfile1
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
    
    - name: Generate test data (if needed)
      run: |
        mkdir -p results/mixtures/SUBJ_01
        # Run a quick script to generate dummy test data if it doesn't exist
        python -c "
import mne, numpy as np, pathlib
path = pathlib.Path('results/mixtures/SUBJ_01/mixture_snr-5_seed0-raw.fif')
if not path.exists():
    info = mne.create_info(ch_names=['EMG1', 'ECG1'], sfreq=250.0, ch_types=['eeg', 'eeg'])
    raw = mne.io.RawArray(np.random.randn(2, 2500), info)
    raw.save(path, overwrite=True)
"
    
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=physiosignal --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
