version: '3.8'

services:
  api:
    build: .
    container_name: physiosignal-api
    ports:
      - "8000:8000"
    volumes:
      # Persistir resultados fuera del contenedor
      - ./results:/app/results
      # Montar código fuente para desarrollo (hot reload)
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command: python run_api.py
